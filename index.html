<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1f3a">
<title>Sutherland European Adventure 2026</title>
<style>
:root {
  --navy:#1a1f3a; --gold:#c9a84c; --gold-light:#e8d5a3; --stone:#f5f0e8;
  --stone-dark:#e8e0d0; --text:#2c2c2c; --text-muted:#6b6b6b; --white:#fff;
  --green:#1a5c3a; --green-light:#e8f4ee; --purple:#7c3d8f; --amber:#8b5e00;
  --blue:#2d6a8f; --blue-light:#e8f2f8; --red:#c0392b;
  --shadow:0 2px 12px rgba(26,31,58,.10); --shadow-lg:0 8px 32px rgba(26,31,58,.15);
  --radius:12px; --radius-sm:8px; --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Georgia,serif;background:var(--stone);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── PIN SCREEN ── */
#pin-screen{position:fixed;inset:0;background:var(--navy);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px}
.pin-logo{font-size:48px;margin-bottom:8px}
.pin-title{font-size:22px;color:var(--gold);font-family:Georgia,serif;text-align:center;margin-bottom:4px}
.pin-sub{font-size:13px;color:rgba(255,255,255,.5);font-family:Arial,sans-serif;margin-bottom:32px;text-align:center}
.pin-dots{display:flex;gap:12px;margin-bottom:24px}
.pin-dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.2);transition:.2s}
.pin-dot.filled{background:var(--gold)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:240px}
.pin-btn{background:rgba(255,255,255,.1);border:none;color:#fff;font-size:22px;font-family:Arial,sans-serif;font-weight:600;border-radius:50%;width:72px;height:72px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center}
.pin-btn:active{background:var(--gold);color:var(--navy);transform:scale(.93)}
.pin-btn.del{font-size:18px}
.pin-error{color:#e74c3c;font-size:13px;font-family:Arial,sans-serif;margin-top:12px;height:18px;text-align:center}

/* ── HEADER ── */
.app-header{background:var(--navy);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-lg)}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.trip-title{font-size:16px;font-weight:700;color:var(--gold);letter-spacing:.3px;line-height:1.3;font-family:Georgia,serif}
.trip-dates{font-size:11px;color:rgba(255,255,255,.55);font-family:Arial,sans-serif;margin-top:2px}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;margin-left:12px}
.days-to-go{font-size:22px;font-weight:700;color:var(--gold);line-height:1}
.days-label{font-size:10px;color:rgba(255,255,255,.5);font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px}
.lock-btn{background:none;border:none;color:rgba(255,255,255,.4);font-size:16px;cursor:pointer;padding:2px}
.progress-bar-wrap{margin-bottom:10px}
.progress-label{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.4);font-family:Arial,sans-serif;margin-bottom:4px}
.progress-track{height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),#e8d5a3);border-radius:2px;transition:width 1s ease}
.segment-tabs{display:flex;overflow-x:auto;scrollbar-width:none;gap:2px;padding-bottom:1px}
.segment-tabs::-webkit-scrollbar{display:none}
.seg-tab{flex-shrink:0;padding:7px 10px 9px;border:none;background:transparent;color:rgba(255,255,255,.45);font-size:10px;font-family:Arial,sans-serif;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg-tab .te{font-size:15px}.seg-tab .tl{font-size:9px;text-transform:uppercase;letter-spacing:.4px}
.seg-tab.active{color:var(--gold);border-bottom-color:var(--gold)}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--stone-dark);padding:8px 12px calc(8px + var(--safe-bottom));display:flex;gap:8px;z-index:90;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.nav-btn{flex:1;padding:10px 6px;border:none;border-radius:var(--radius-sm);font-size:12px;font-family:Arial,sans-serif;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s}
.nav-btn:active{transform:scale(.96)}
.nav-btn .nb-icon{font-size:18px;line-height:1}
.nav-btn .nb-label{font-size:9px;text-transform:uppercase;letter-spacing:.4px}
.nav-btn.primary{background:var(--navy);color:var(--gold)}
.nav-btn.secondary{background:var(--stone-dark);color:var(--text-muted)}
.nav-btn.active-docs{background:var(--amber);color:#fff}

/* ── MAIN ── */
.main{padding:16px 16px 120px;max-width:600px;margin:0 auto}

/* ── SEGMENT HEADER ── */
.segment-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:12px 14px;border-radius:var(--radius);background:var(--white);box-shadow:var(--shadow)}
.seg-icon{font-size:26px;flex-shrink:0}.seg-name{font-size:15px;font-weight:700;color:var(--navy)}.seg-count{font-size:12px;color:var(--text-muted);font-family:Arial,sans-serif;margin-top:1px}

/* ── DAY CARD ── */
.day-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;transition:box-shadow .2s}
.day-card.today{box-shadow:0 0 0 2px var(--gold),var(--shadow-lg)}
.day-card-header{cursor:pointer;user-select:none}

/* Hero image */
.day-hero-svg{width:100%;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
.day-hero-svg::after{content:'';position:absolute;bottom:0;left:0;right:0;height:50px;background:linear-gradient(to top,rgba(0,0,0,.35),transparent)}
.hero-emoji{font-size:52px;line-height:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4));z-index:1}
.hero-label{font-size:13px;font-weight:700;color:rgba(255,255,255,.95);font-family:Georgia,serif;margin-top:8px;letter-spacing:.3px;text-shadow:0 1px 4px rgba(0,0,0,.5);z-index:1}
.hero-sublabel{font-size:10px;color:rgba(255,255,255,.65);font-family:Arial,sans-serif;margin-top:3px;text-shadow:0 1px 3px rgba(0,0,0,.4);z-index:1}
/* Stars effect for night scenes */
.hero-stars{position:absolute;inset:0;z-index:0}
.day-hero-placeholder{width:100%;height:80px;display:flex;align-items:center;justify-content:center;font-size:36px;background:linear-gradient(135deg,var(--stone),var(--stone-dark))}

/* Header info */
.day-header-info{padding:12px 14px 8px;display:flex;align-items:flex-start;gap:10px}
.day-flag-date{flex-shrink:0;display:flex;flex-direction:column;align-items:center;min-width:42px}
.day-flag{font-size:20px;line-height:1}
.day-date-label{font-size:9px;color:var(--text-muted);font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:.3px;margin-top:3px;text-align:center}
.day-main{flex:1;min-width:0}
.day-location{font-size:14px;font-weight:700;color:var(--navy);line-height:1.3;margin-bottom:3px}
.day-preview{font-size:12px;color:var(--text-muted);font-family:Arial,sans-serif;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.day-chevron{flex-shrink:0;color:var(--text-muted);font-size:11px;margin-top:3px;transition:transform .25s}
.day-card.open .day-chevron{transform:rotate(180deg)}
.tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:9px;font-family:Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:20px}
.tag-included{background:var(--green-light);color:var(--green)}
.tag-booked{background:#fff3e0;color:#e65100}
.tag-flight{background:var(--blue-light);color:var(--blue)}
.tag-arrival{background:var(--purple-light,#f3eaf6);color:var(--purple)}

/* ── DAY BODY ── */
.day-body{display:none;border-top:1px solid var(--stone-dark)}
.day-card.open .day-body{display:block}
.day-section{padding:11px 14px;border-bottom:1px solid var(--stone-dark)}
.day-section:last-child{border-bottom:none}
.section-label{font-size:9px;font-family:Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:5px}
.section-content{font-size:13px;font-family:Arial,sans-serif;line-height:1.6;color:var(--text)}
.stops-list{padding:0;margin:0}
.stop-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--stone-dark);align-items:flex-start;cursor:pointer}
.stop-row:last-child{border-bottom:none}
.stop-row.no-detail{cursor:default}
.stop-time{font-size:13px;font-weight:700;color:var(--text-muted);min-width:54px;padding-top:2px;font-family:Arial,sans-serif;flex-shrink:0}
.stop-main{flex:1;min-width:0}
.stop-header{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.stop-name{font-size:16px;font-weight:600;color:var(--text);font-family:Arial,sans-serif;line-height:1.3}
.stop-summary{font-size:13px;color:var(--text-muted);font-family:Arial,sans-serif;margin-top:2px;line-height:1.4}
.stop-toggle{font-size:11px;font-weight:700;color:var(--gold);white-space:nowrap;flex-shrink:0;padding-top:3px;font-family:Arial,sans-serif}
.stop-detail{display:none;margin-top:8px;padding:10px 12px;background:var(--stone);border-radius:8px;font-size:15px;line-height:1.6;color:var(--text);font-family:Arial,sans-serif;border-left:3px solid var(--gold)}
.accom-icon{font-size:15px;margin-right:6px}
.excursion-block{background:var(--green-light);border-left:3px solid var(--green);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:9px 11px;font-size:13px;font-family:Arial,sans-serif;line-height:1.5;color:#1a3d2a}
.excursion-block.booked{background:#fff8e8;border-left-color:var(--gold);color:#5a3e00}

/* ── ACTION BUTTONS ── */
.action-row{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;background:var(--stone);border-top:1px solid var(--stone-dark)}
.btn{flex:1;min-width:80px;padding:9px 10px;border-radius:var(--radius-sm);border:none;font-size:11px;font-family:Arial,sans-serif;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;text-decoration:none;transition:opacity .15s,transform .1s;text-align:center}
.btn:active{transform:scale(.97);opacity:.85}
.btn-map{background:var(--navy);color:#fff}
.btn-book{background:var(--gold);color:var(--navy)}
.btn-ticket{background:var(--red);color:#fff}
.btn-rest{background:#8b1a1a;color:#fff}

/* ── NOTES ── */
.notes-section{padding:10px 14px;background:#fffdf5;border-top:1px solid var(--stone-dark)}
.notes-label{display:flex;align-items:center;gap:5px;font-size:10px;font-family:Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--amber);margin-bottom:6px}
.notes-textarea{width:100%;min-height:68px;padding:8px 10px;border:1.5px solid var(--stone-dark);border-radius:var(--radius-sm);font-size:13px;font-family:Arial,sans-serif;color:var(--text);background:#fff;resize:vertical;outline:none;transition:border-color .2s;line-height:1.5}
.notes-textarea:focus{border-color:var(--gold)}
.notes-textarea::placeholder{color:#bbb}
.notes-saved{font-size:10px;font-family:Arial,sans-serif;color:var(--green);margin-top:3px;opacity:0;transition:opacity .3s;height:13px}
.notes-saved.show{opacity:1}

/* ── TODAY BADGE ── */
.today-badge{display:inline-flex;align-items:center;gap:3px;background:var(--gold);color:var(--navy);font-size:9px;font-family:Arial,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;border-radius:10px;margin-left:6px;vertical-align:middle}

/* ── DOCS PANEL ── */
#docs-panel{display:none;padding:16px 16px 120px;max-width:600px;margin:0 auto}
#pack-panel{display:none;padding:16px 16px 120px;max-width:600px;margin:0 auto}
.pack-section{margin-bottom:24px}
.pack-section-title{font-size:15px;font-weight:700;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:4px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.pack-subsection{font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px}
.pack-item{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:6px;margin-bottom:4px;background:var(--stone);cursor:pointer;transition:.15s}
.pack-item:active{transform:scale(.98)}
.pack-item.checked{background:#e8f5e9;opacity:.75}
.pack-item input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:var(--navy);flex-shrink:0;margin-top:1px}
.pack-item-text{flex:1;font-size:14px;color:var(--text-main)}
.pack-item.checked .pack-item-text{text-decoration:line-through;color:var(--text-muted)}
.pack-item-badge{font-size:11px;font-weight:700;color:var(--white);background:var(--navy);border-radius:4px;padding:1px 6px;flex-shrink:0;white-space:nowrap}
.pack-progress{background:var(--stone-dark);border-radius:999px;height:8px;margin-bottom:6px;overflow:hidden}
.pack-progress-bar{height:8px;background:var(--navy);border-radius:999px;transition:.3s}
.pack-summary{font-size:12px;color:var(--text-muted);margin-bottom:16px}
.pack-note{font-size:12px;color:var(--text-muted);font-style:italic;padding:8px 10px;background:var(--stone);border-left:3px solid var(--gold);border-radius:0 6px 6px 0;margin-bottom:6px}
.nav-btn.active-pack{background:var(--navy);color:var(--gold)}
.nav-btn.active-home{background:var(--gold);color:var(--navy)}
.nav-btn.active-task{background:#2d7a4f;color:#fff}
#home-panel{display:none;padding:16px 16px 120px;max-width:600px;margin:0 auto}
.home-welcome{background:linear-gradient(160deg,var(--navy) 0%,#2d4a8f 100%);border-radius:var(--radius);padding:20px;margin-bottom:16px;text-align:center}
.home-welcome-title{font-size:20px;font-weight:700;color:var(--gold);font-family:Georgia,serif;margin-bottom:4px}
.home-welcome-sub{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:16px}
.home-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.home-stat{background:rgba(255,255,255,.1);border-radius:8px;padding:10px 6px;text-align:center}
.home-stat-num{font-size:22px;font-weight:700;color:var(--gold)}
.home-stat-label{font-size:10px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.4px}
.home-btn-row{display:flex;gap:10px;justify-content:center}
.home-action-btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:Arial,sans-serif;transition:.15s}
.home-action-btn:active{transform:scale(.96)}
.home-action-btn.today{background:var(--gold);color:var(--navy)}
.home-action-btn.signout{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}
.cal-section{margin-bottom:20px}
.cal-month{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--navy);text-transform:uppercase;letter-spacing:.5px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:10px;font-weight:700;color:var(--text-muted);text-align:center;padding:3px 0;text-transform:uppercase}
.cal-day{border-radius:6px;padding:4px 2px;text-align:center;cursor:default;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px}
.cal-day.empty{background:transparent}
.cal-day.trip{cursor:pointer;background:var(--stone)}
.cal-day.trip:active{transform:scale(.95)}
.cal-day.today-day{background:var(--gold)!important;box-shadow:0 0 0 2px var(--navy)}
.cal-day.pre-trip{background:transparent;opacity:.4}
.cal-day-num{font-size:13px;font-weight:700;color:var(--text-main);line-height:1}
.cal-day.today-day .cal-day-num{color:var(--navy)}
.cal-day-emoji{font-size:11px;line-height:1}
.cal-day-seg{font-size:8px;color:var(--text-muted);line-height:1;text-align:center;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal-day.today-day .cal-day-seg{color:var(--navy)}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cal-legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted)}
.cal-legend-dot{width:10px;height:10px;border-radius:3px}
.nav-btn.active-esim{background:#7c3d8f;color:#fff}
#task-panel{display:none;padding:16px 16px 120px;max-width:600px;margin:0 auto}
#esim-panel{display:none;padding:16px 16px 120px;max-width:600px;margin:0 auto}
.task-group{margin-bottom:20px}
.task-group-title{font-size:14px;font-weight:700;color:var(--white);background:#2d7a4f;padding:8px 12px;border-radius:6px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:6px;margin-bottom:4px;background:var(--stone);cursor:pointer;transition:.15s}
.task-item:active{transform:scale(.98)}
.task-item.done{background:#e8f5e9;opacity:.7}
.task-item input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:#2d7a4f;flex-shrink:0;margin-top:2px}
.task-item-body{flex:1}
.task-item-text{font-size:14px;color:var(--text-main);line-height:1.3}
.task-item.done .task-item-text{text-decoration:line-through;color:var(--text-muted)}
.task-item-meta{font-size:11px;color:var(--text-muted);margin-top:2px}
.task-badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0;white-space:nowrap}
.task-badge.urgent{background:#c0392b;color:#fff}
.task-badge.soon{background:#e67e22;color:#fff}
.task-badge.whenever{background:#7f8c8d;color:#fff}
.task-badge.done-badge{background:#2d7a4f;color:#fff}
.task-progress{background:var(--stone-dark);border-radius:999px;height:8px;margin-bottom:6px;overflow:hidden}
.task-progress-bar{height:8px;background:#2d7a4f;border-radius:999px;transition:.3s}
.task-summary{font-size:12px;color:var(--text-muted);margin-bottom:12px}
.esim-card{background:var(--stone);border-radius:var(--radius);padding:14px;margin-bottom:14px;border-left:4px solid #7c3d8f}
.esim-card h3{font-size:14px;font-weight:700;color:#7c3d8f;margin:0 0 8px}
.esim-step{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--stone-dark);align-items:flex-start}
.esim-step:last-child{border-bottom:none}
.esim-step-num{width:22px;height:22px;background:#7c3d8f;color:#fff;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.esim-step-text{font-size:13px;color:var(--text-main);line-height:1.4;flex:1}
.esim-step-text strong{color:var(--navy)}
.esim-note{font-size:12px;color:var(--text-muted);font-style:italic;padding:8px 10px;background:var(--stone);border-left:3px solid #7c3d8f;border-radius:0 6px 6px 0;margin:6px 0}
.esim-warning{font-size:12px;color:#c0392b;padding:8px 10px;background:#fdf2f2;border-left:3px solid #c0392b;border-radius:0 6px 6px 0;margin:6px 0;font-weight:600}
.docs-header{background:var(--white);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.docs-header h2{font-size:16px;color:var(--navy);margin-bottom:4px}
.docs-header p{font-size:12px;color:var(--text-muted);font-family:Arial,sans-serif;line-height:1.5}
.doc-category{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.doc-cat-header{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--stone)}
.doc-cat-icon{font-size:20px}
.doc-cat-title{font-size:14px;font-weight:700;color:var(--navy);flex:1}
.doc-cat-chev{color:var(--text-muted);font-size:11px;transition:transform .25s}
.doc-category.open .doc-cat-chev{transform:rotate(180deg)}
.doc-cat-body{display:none;padding:12px 14px;border-top:1px solid var(--stone-dark)}
.doc-category.open .doc-cat-body{display:block}
.doc-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--stone-dark)}
.doc-item:last-child{border-bottom:none}
.doc-item-info{flex:1}
.doc-item-name{font-size:13px;font-weight:700;color:var(--navy)}
.doc-item-detail{font-size:11px;color:var(--text-muted);font-family:Arial,sans-serif;margin-top:2px}
.doc-link-btn{background:var(--navy);color:var(--gold);border:none;border-radius:var(--radius-sm);padding:6px 11px;font-size:11px;font-family:Arial,sans-serif;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.doc-note-area{width:100%;margin-top:10px;padding:8px 10px;border:1.5px solid var(--stone-dark);border-radius:var(--radius-sm);font-size:12px;font-family:Arial,sans-serif;min-height:60px;resize:vertical;outline:none;background:#fff}
.doc-note-area:focus{border-color:var(--gold)}
.doc-save-btn{margin-top:6px;background:var(--amber);color:#fff;border:none;border-radius:var(--radius-sm);padding:7px 14px;font-size:11px;font-family:Arial,sans-serif;font-weight:700;cursor:pointer}
.doc-saved{font-size:10px;font-family:Arial,sans-serif;color:var(--green);margin-left:8px;opacity:0;transition:opacity .3s}
.doc-saved.show{opacity:1}
.doc-url-input{width:100%;padding:8px 10px;border:1.5px solid var(--stone-dark);border-radius:var(--radius-sm);font-size:12px;font-family:Arial,sans-serif;outline:none;background:#fff;margin-top:6px}
.doc-url-input:focus{border-color:var(--gold)}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.day-card{animation:fadeIn .22s ease both}
.day-card:nth-child(2){animation-delay:.04s}.day-card:nth-child(3){animation-delay:.08s}
.day-card:nth-child(4){animation-delay:.12s}.day-card:nth-child(5){animation-delay:.16s}
</style>

ays before, very quiet after 5pm). Restored interior breathtaking. 30-40 min. 5:55pm: From Notre-Dame, walk back to the hotel through the Latin Quarter (~20 min) instead of the Batobus — enjoy the Odette cream puffs along the way. Evening left free from 6pm — no bookings, rest at the hotel or find dinner wherever the mood takes you.",
      excursion:"Opera Garnier 11:30am ~€15 (operadeparis.fr) | Sainte-Chapelle 4:30pm €22 (sainte-chapelle.fr) | Notre-Dame free (notredamedeparis.fr, book 2 days before)",

        {time:"8:00am",name:"Maison Gregoire breakfast",summary:"69 Rue Monge — on your street — opens 8am Sunday",detail:"Maison Gregoire at 69 Rue Monge is literally around the corner from the hotel. Excellent organic sourdough bread, pain au raisin, croissants, pastries. A couple of tables out front or take away. Open from 8am Sunday. Buy breakfast here and pick up provisions for the train — a baguette sandwich, pastries, something for the 2 hour journey to Amsterdam."},

        {time:"10:00am",name:"Gare du Nord Eurostar checkin",summary:"No passport control — ticket check and security only",detail:"Paris to Amsterdam is intra-Schengen so no passport control required. Simply check in at the Eurostar desk, pass through security screening and find your carriage. Much simpler than the London service. Platform announced approximately 15 min before departure."},
        {time:"10:25am",name:"Eurostar departs Paris Nord",summary:"Paris to Amsterdam Centraal — BOOKED",detail:"Arrives Amsterdam Centraal approximately 1:50pm. Seats confirmed. Eat your Maison Gregoire provisions on the train. The journey passes through Belgium — look out for Antwerp and Rotterdam. A thoroughly civilised way to travel."},

        {time:"~8:00pm",name:"Evening Amsterdam walk — De Wallen",summary:"10 min walk from ship to the old centre",detail:"Amsterdam Centraal is 10 min walk from the ship. Head into the old centre for an evening walk through De Wallen, the Red Light District. One of the most atmospheric and historically fascinating parts of any European city."},
        {time:"8:10pm",name:"Zeedijk — Chinatown gateway",summary:"Start here from the station end",detail:"Zeedijk runs from Amsterdam Centraal into De Wallen and doubles as the city Chinatown. Excellent noodle bars, Chinese bakeries, Dutch brown cafes. A great atmospheric entry point."},
        {time:"8:20pm",name:"Oudezijds Voorburgwal canal",summary:"Main canal street of De Wallen",detail:"The primary canal street of the Red Light District. Medieval houses leaning over the water, canal boats, bridge views. The atmosphere at night with red neon reflecting on the canals is extraordinary. Walk south toward the Oude Kerk."},

    { date:"Thu 01 Oct", location:"Vienna, Austria", flag:"🇦🇹",
      img:"linear-gradient(160deg,#6b1a2d 0%,#3a0f1a 50%,#200a0f 100%)",heroEmoji:"🎻",heroLabel:"Vienna, Austria",heroSub:"City of Waltzes · State Opera · Ringstrasse",
      accommodation:"Viking Magni (overnight Vienna)", transport:"Ship docks Vienna overnight",
      activity:"Viking Panoramic coach tour 8:30am. Free afternoon and evening. Vienna Secession (Klimt Beethoven Frieze). Café Landtmann on the Ringstrasse. KHM Thursday Dinner under the Cupola Hall dome — book in advance at genussimmuseum.at. Ship overnight in Vienna.",
      excursion:"Viking Panoramic Vienna coach tour 8:30am–noon — Ringstrasse, Hofburg exterior, St Stephen's Cathedral, State Opera facade", tags:["included"],
      links:[{label:"📍 Day Map — Dock → Secession → Landtmann → KHM",url:"https://www.google.com/maps/dir/Handelskai+265,+Vienna+Austria/Vienna+Secession+Friedrichstrasse+12/Caf%C3%A9+Landtmann+Universit%C3%A4tsring+4+Vienna/Kunsthistorisches+Museum+Vienna+Maria-Theresien-Platz",type:"map"},{label:"Vienna Secession — tickets",url:"https://www.secession.at/en/",type:"book"},{label:"KHM Thursday Dinner — book here",url:"https://www.genussimmuseum.at",type:"book"},{label:"Café Landtmann",url:"https://www.landtmann.at/en/",type:"info"},{label:"Vienna U-Bahn tickets",url:"https://www.wienerlinien.at/en/tickets",type:"info"}] ,
      stops:[
        {time:"8:30am",name:"Viking Panoramic Vienna — included coach tour",summary:"3.5 hrs — Ringstrasse, Hofburg, St Stephen's, State Opera exteriors",detail:"Viking included panoramic coach and walking tour of Vienna. Covers the Ringstrasse boulevard, Hofburg Palace exterior (winter residence of the Habsburgs, home of the Spanish Riding School), Gothic St Stephen's Cathedral with its famous glazed diamond-patterned roof tiles, and the Vienna State Opera facade. Easy pace — walking portions over flat surfaces, total standing time under 1.5 hours. Finishes approximately noon back at the ship. An excellent orientation of the city before your independent afternoon and evening."},
        {time:"~12:30pm",name:"Lunch on board Viking Magni",summary:"Rest and freshen up before heading back into the city",detail:"Return to the ship for lunch after the morning tour. Take your time — the afternoon plan is relaxed and there is no need to rush back out. Comfortable shoes recommended for the afternoon walk along the Ringstrasse."},
        {time:"~2:00pm",name:"Walk to Vorgartenstrasse U1",summary:"5–10 min walk from ship — buy 24hr transit pass (~€8)",detail:"Walk 5 to 10 minutes from the ship along the Handelskai promenade to Vorgartenstrasse U1 station. Buy a 24-hour Wiener Linien transit pass at the ticket machine (approximately €8) — this covers unlimited U-Bahn, tram and bus for the rest of the day and all of the evening including the return from the KHM dinner. Trains run every 2 to 5 minutes. Take U1 direction Oberlaa — 5 stops to Karlsplatz (approximately 12 minutes)."},
        {time:"~2:30pm",name:"Vienna Secession — Klimt's Beethoven Frieze",summary:"~€10 — 45 min — Karlsplatz, 5 min walk from U1",detail:"Exit Karlsplatz U1 and walk 5 minutes south to the Vienna Secession building — unmistakable with its golden cabbage dome. Built in 1898 as the architectural manifesto of Vienna's breakaway modernist movement. In the basement, Klimt's 34-metre Beethoven Frieze was painted directly onto three walls in 1902 for an exhibition and was intended to be temporary. Over a century later it remains — one of the most powerful and haunting works of Art Nouveau anywhere in the world. Entry approximately €10. Open Tuesday to Sunday. No advance booking required. Allow 45 minutes. On Thursday evenings the KHM holds Klimt's The Kiss — seeing the Frieze this afternoon gives you the full arc of Klimt's golden period across one day."},
        {time:"~3:30pm",name:"Café Landtmann — afternoon coffee",summary:"Ringstrasse — grand coffee house — Melange and Apfelstrudel — 1.5 hrs",detail:"Walk 10 minutes north from the Secession along the Ringstrasse to Café Landtmann, Universitätsring 4 — the grand coffee house directly opposite the Burgtheater. Open since 1873. Regular guests included Sigmund Freud, Thomas Mann and Gustav Mahler. Today a comfortable mix of Viennese professionals and visitors — elegant but not stiff, with a sheltered outdoor terrace framing the Burgtheater facade. Order a Melange (Vienna's classic milky coffee — order a cappuccino and you mark yourself as a tourist immediately) and Apfelstrudel or Kaiserschmarrn. Sit for as long as you like — this is the point. No rush. NOTE: Café Central is closed for renovation until autumn 2026 — Landtmann is the right call. Allow 1.5 hours."},
        {time:"~5:00pm",name:"Return to ship — freshen up for dinner",summary:"Walk to Stephansplatz or Rathaus, U1 back to Vorgartenstrasse",detail:"From Café Landtmann walk 5 minutes to Rathaus U2 or 8 minutes to Stephansplatz U1. Take U1 to Vorgartenstrasse, walk to ship. The KHM dinner is smart casual — the setting is formal imperial but the dress code is relaxed elegant. Think what you would wear to a good restaurant in Paris. Allow yourself time to arrive at the KHM comfortably before 6pm."},
        {time:"~5:45pm",name:"Depart for KHM Dinner",summary:"U1 Vorgartenstrasse → Stephansplatz, then 12 min walk to KHM",detail:"Walk to Vorgartenstrasse U1, take U1 direction Oberlaa to Stephansplatz (4 stops, approximately 10 minutes). Walk 12 minutes west along the Burgring — past the Hofburg, the equestrian monuments on Heldenplatz, and the twin museum buildings — to the Kunsthistorisches Museum on Maria-Theresien-Platz. ALTERNATIVE: taxi or Uber from ship directly to KHM (~€10, 10 min) if you prefer to arrive fresh rather than walk the Burgring in the evening."},
        {time:"6:00pm",name:"KHM Thursday Dinner — Cupola Hall",summary:"Five courses under the museum dome — book genussimmuseum.at",detail:"Every Thursday evening the Cupola Hall of the Kunsthistorisches Museum becomes one of the most extraordinary dining rooms in Europe. The hall sits on the first floor under the museum's great central dome — marble pillars rising to magnificent ceiling frescoes, vast airy space in soft evening light, the world's great art collections in the rooms surrounding you. Five-course menu of classic Austrian and European cuisine. Dinner runs approximately 6pm to 10pm. BOOK IN ADVANCE at genussimmuseum.at — fills weeks ahead. Ship remains docked overnight and sails late Friday evening — absolutely no time pressure. Approximately 12,400 steps today including the Viking tour."},
        {time:"~10:00pm",name:"Return to Viking Magni",summary:"U1 Stephansplatz → Vorgartenstrasse — metro runs until 12:30am",detail:"Walk back to Stephansplatz and take U1 direction Leopoldau to Vorgartenstrasse (4 stops), then walk to the ship. Vienna metro runs until approximately 12:30am on weekdays so there is no rush. The 24-hour pass bought this afternoon covers the return journey. Ship remains in Vienna overnight — a remarkable Thursday in one of the world's great cities."}
      ]},

    { date:"Fri 02 Oct", location:"Vienna, Austria (Day 2)", flag:"🇦🇹",
      img:"linear-gradient(160deg,#4a2d6b 0%,#2d1a3a 50%,#1a0f25 100%)",heroEmoji:"🎨",heroLabel:"Vienna, Austria – Day 2",heroSub:"Belvedere Gallery · Klimt's The Kiss · Café Culture",
      accommodation:"Viking Magni (overnight Vienna)", transport:"Ship docked overnight Vienna",
      activity:"Entirely free day — no museums, no tickets, no bookings. Naschmarkt morning browse and breakfast. Mariahilfer Strasse and Spittelberg cobblestone quarter. Volksgarten rose garden. Graben and Kohlmarkt walk. Beisl lunch. Café Sperl afternoon. Back to ship by 4pm. Ship sails this evening for Budapest. Approximately 10,500 steps.",
      excursion:"Free day — Naschmarkt, Spittelberg, Volksgarten, Graben walk, Café Sperl — ship sails this evening for Budapest", tags:["included"],
      links:[{label:"📍 Day Map — Dock → Naschmarkt → Spittelberg → Volksgarten → Graben → Sperl → Dock",url:"https://www.google.com/maps/dir/Handelskai+265+Vienna/Naschmarkt+Vienna+Kettenbr%C3%BCckengasse/Mariahilfer+Strasse+Vienna/Spittelberg+Vienna/Volksgarten+Vienna/Graben+Vienna/Caf%C3%A9+Sperl+Gumpendorfer+Strasse+11+Vienna/Handelskai+265+Vienna",type:"map"},{label:"Naschmarkt info",url:"https://www.wien.info/en/sightseeing/markets/naschmarkt",type:"info"},{label:"Café Sperl",url:"https://www.cafesperl.at",type:"info"}],
      stops:[
        {time:"Morning",name:"Relaxed start — breakfast on board",summary:"No alarm — ship sails this evening for Budapest",detail:"No early start needed. Breakfast on board at leisure. The ship sails late this evening for Budapest so there is absolutely no pressure today. Head into the city mid-morning. Bring comfortable shoes and a light jacket — early October in Vienna is typically 14–18°C. Today has no tickets, no bookings and no queues — just the city going about its Friday business around you. Approximately 10,500 steps today, well broken up with café and market sits."},
        {time:"~10:00am",name:"U1 to Karlsplatz, U4 to Naschmarkt",summary:"Vorgartenstrasse → Karlsplatz → Kettenbrückengasse — one change",detail:"Walk 5 to 10 minutes to Vorgartenstrasse U1. Take U1 direction Oberlaa to Karlsplatz (5 stops, approximately 12 minutes). Change to U4 direction Hütteldorf — one stop to Kettenbrückengasse. Exit the station and you are at the eastern end of the Naschmarkt. Single tickets approximately €3 each, or buy a 24-hour pass (~€8) if you plan multiple trips."},
        {time:"~10:15am",name:"Naschmarkt — browse and breakfast",summary:"130 stalls, 1.5km — Friday farmers' market runs alongside — free entry",detail:"Vienna's great open-air market stretches 1.5km along the Wienzeile. Friday is one of the better weekday days — the farmers' market runs alongside the regular stalls bringing local producers with seasonal Austrian produce. Go with curiosity rather than a shopping agenda. Walk the full length slowly, taking in the cheeses, spices, olives, Middle Eastern and Austrian delicacies. For breakfast or brunch: Neni am Naschmarkt has a proper sit-down brunch menu inside the market, or simply find a counter stall for coffee and a pastry. The morning energy here is entirely local — Viennese residents doing their Friday shop around you. NOTE: some vendors at deli stalls can be pushy — just wave and move on. Free entry. Allow 1.5 hours."},
        {time:"~11:45am",name:"Mariahilfer Strasse",summary:"Vienna's pedestrian shopping boulevard — local not touristy — 20 min wander",detail:"Walk east from the Naschmarkt toward the city along Mariahilfer Strasse — Vienna's main pedestrianised shopping boulevard, almost 2km long, entirely local in character. This is where Viennese people actually shop: department stores, independent shops, bakeries, cafes, all under 19th century imperial facades. Not a tourist strip. Good for a 20-minute wander at a slow pace. Duck into side streets for a different perspective — the residential lanes either side have a quieter neighbourhood feel."},
        {time:"~12:15pm",name:"Spittelberg quarter",summary:"Cobblestoned 18th century village tucked inside the city — free",detail:"Turn north off Mariahilfer Strasse into the Spittelberg quarter — a compact grid of narrow cobblestoned streets dating from the 18th century that feels like a village transplanted into the middle of Vienna. Small independent galleries, wine bars, neighbourhood restaurants and craft shops. One of the most genuinely charming corners of the city and almost entirely off the main tourist circuit. Wander without an agenda for 20 to 30 minutes. No entry fee, no agenda."},
        {time:"~12:45pm",name:"Volksgarten rose garden",summary:"Free — 3,000 rose bushes alongside the Hofburg — still flowering in October",detail:"Walk east from Spittelberg toward the Ringstrasse and into the Volksgarten — the formal rose garden alongside the Hofburg Palace. Over 3,000 rose bushes and 200 varieties, with the season running May to October so early October should still have flowers. Free to enter, open from 6am. Locals walk dogs and read newspapers here on Friday mornings. The Theseus Temple provides a neoclassical backdrop. A completely unhurried 20 to 30 minutes. From the garden's eastern edge you get a proper on-foot view of the Hofburg — the same palace you passed on the coach yesterday, now at walking pace with time to take it in."},
        {time:"~1:15pm",name:"Graben and Kohlmarkt — walk and lunch",summary:"Vienna's finest pedestrian streets — then find a Beisl for lunch",detail:"Walk through the Heldenplatz past the Hofburg main entrance and east onto the Kohlmarkt, then the Graben — the two great pedestrian streets of the old city connecting the Hofburg to Stephansplatz. The Graben holds the Pestsäule, the elaborate baroque plague column erected in 1693. Extraordinary 19th century facades on both streets, street musicians, window shopping at the finest shops in the city. 15 minutes to walk the full length — all free, no entry required. For lunch find a Beisl — a traditional Viennese tavern. Look for a handwritten menu in German with locals eating: Wiener Schnitzel, Gulasch, Tafelspitz (boiled beef with vegetables and horseradish). The streets around Stephansplatz and the 1st district have plenty. Nothing fancy, nothing tourist-facing. Allow 1 hour for a proper sit-down lunch."},
        {time:"~2:30pm",name:"Café Sperl",summary:"Gumpendorfer Strasse 11 — open since 1880 — Sperltorte and Grosser Brauner",detail:"From Stephansplatz take U1 to Karlsplatz (2 stops, 4 minutes) then walk 8 minutes to Café Sperl, Gumpendorfer Strasse 11. Open since 1880 and virtually unchanged — wooden parquet floors, bentwood Thonet chairs, marble tables, crystal chandeliers, billiard tables in the back room, locals reading newspapers. Featured in the film Before Sunrise. Completely different in character to Café Landtmann on Thursday — neighbourhood rather than grand boulevard, worn-in rather than polished. Order the house Sperltorte (chocolate and almond cake, their signature) and a Grosser Brauner (large black coffee served with a small jug of cream on the side). Sit for as long as you like. No laptops, no agenda. This is the other Vienna — the one that has existed quietly since 1880. Allow 1.5 hours."},
        {time:"~4:00pm",name:"Return to Viking Magni",summary:"U4 Kettenbrückengasse → Karlsplatz → U1 → Vorgartenstrasse",detail:"From Café Sperl walk 5 minutes to Kettenbrückengasse U4 station. One stop east to Karlsplatz, change to U1 direction Leopoldau, 5 stops to Vorgartenstrasse, walk to ship. Back on board comfortably by 4:30pm. Dinner on board this evening as Vienna recedes behind you on the Danube. The ship sails tonight for Budapest. Two full, well-paced days in one of the great European capitals."}
      ]},

        {time:"Option A",name:"Gellert Hill and Citadella",summary:"Best panoramic views over Budapest",detail:"Gellert Hill rises 235 metres above the Danube — the Citadella fortress at the top gives panoramic views over the entire city, both banks of the Danube and all seven bridges. Take the tram to the base then walk up (30 to 45 min). Free to enter the hilltop area."},
        {time:"Option B",name:"Dohany Street Synagogue interior",summary:"Largest synagogue in Europe — book in advance",detail:"The Dohany Street Synagogue interior is extraordinary — Moorish-Byzantine decoration, organ where Franz Liszt once played, the museum, and the Emanuel Tree memorial garden. Book tickets in advance. Allow 1 to 1.5 hours."},
        {time:"Option C",name:"Szechenyi Thermal Baths",summary:"Budapest famous outdoor thermal pools",detail:"Szechenyi Thermal Baths in City Park are the most famous in Budapest — grand neo-baroque building with outdoor pools, indoor pools, steam rooms and saunas. A quintessential Budapest experience. Buy tickets online. Allow 2 to 3 hours. Bring a towel or rent one there."},
        {time:"Option D",name:"Great Market Hall revisit",summary:"Pick up Hungarian food souvenirs",detail:"Worth a second browse of the Nagy Vasarcsarnok — paprika (best on the upper level), Pick salami, Tokaji wine, lace tablecloths. The upper level has tourist-oriented stalls but the ground floor is still very local."},
        {time:"Lunchtime",name:"Lunch in the city",summary:"Explore cafes and restaurants at leisure",detail:"The Jewish Quarter has excellent cafes and lunch spots. Or head to the Great Market Hall upper level for a langos (deep fried dough with sour cream and cheese) — classic Hungarian street food."},
        {time:"~6:00pm",name:"Final Budapest dinner",summary:"Last evening before the travel day",detail:"Try Mazel Tov (Akacfa utca 47) for Middle Eastern sharing plates in a stunning open courtyard, or Macesz Bistro (Dob utca 26) for modern Hungarian-Jewish cuisine. Both are in the Jewish Quarter and both excellent."},
        {time:"~9:00pm",name:"Early night — pack tonight",summary:"Private transfer at 8am tomorrow",detail:"Pack properly tonight. Early start tomorrow — private transfer from 7Seasons to Budapest Airport BUD at approximately 8am for OS632 departing 11:15am. Confirm pickup time with your transfer provider this evening."}
      ]}
  ],

        {time:"~12:30pm",name:"Shoes on the Danube",summary:"Moving Holocaust memorial on the riverbank",detail:"60 pairs of iron shoes on the Danube bank commemorating Jews shot into the river during WWII. Simple, powerful, moving. Free."},

        {time:"~5:00pm",name:"Explore Chioggia — Little Venice",summary:"Canals fishing boats Corso del Popolo",detail:"Chioggia (pronounced Kyo-ja) is a fishing town on a long thin island at the southern tip of the Venice lagoon. The pedestrian Corso del Popolo is the vibrant main street. Explore the covered fish market near Ponte Vigo, the canal bridges, the colourful fishing boats, and the Venetian Gothic architecture. Genuinely charming."},

    { date:"Wed 14 Oct", location:"Athens (Piraeus), Greece – Day 1", flag:"🇬🇷",
      img:"linear-gradient(160deg,#5c4a2d 0%,#3a2d1a 50%,#20180f 100%)",heroEmoji:"🏛️",heroLabel:"Athens, Greece – Day 1",heroSub:"Acropolis · Parthenon · UNESCO · Ancient Agora",
      accommodation:"Viking Sky", transport:"Ship docks Piraeus | Metro Line 1 to Athens",
      activity:"The Acropolis & Parthenon (UNESCO). Acropolis Museum. Ancient Agora – heart of Athenian democracy. Temple of Hephaestus (best preserved in Greece). Syntagma Square & Parliament guard changing ceremony.",
      excursion:"✅ INCLUDED: Panoramic Athens & National Archaeological Museum — coach tour + museum, 8:30am, 4 hours", tags:["included"],
      links:[{label:"📍 Day Map — Terminal → Monastiraki → A for Athens → Plaka → Taxi return",url:"https://www.google.com/maps/dir/Piraeus+Cruise+Terminal+Gate+E12/Monastiraki+Square+Athens/A+for+Athens+Miaouli+2+Athens/Plaka+Athens/Piraeus+Cruise+Terminal",type:"map"},{label:"A for Athens rooftop — book table",url:"https://aforathens.com",type:"book"},{label:"Strofi restaurant Athens",url:"https://www.strofiathens.com",type:"book"},{label:"Athens Metro journey planner",url:"https://www.stasy.gr/en/",type:"info"},{label:"Beat app — Athens taxi",url:"https://thebeat.co/en-gr/",type:"info"}] ,
      stops:[
        {time:"8:30am",name:"Viking Panoramic Athens & National Archaeological Museum",summary:"Included 4-hour excursion — coach tour + museum interior — returns ~12:30pm",detail:"Viking included excursion departing 8:30am from Piraeus. Moderate pace — 1.5 to 3 hours walking total. Coach journey from Piraeus passes the small harbour of Zea (5th century BC dock survives) and the elegant promenade at Mikrolimano. In central Athens: Hellenic Parliament and Syntagma Square, the distinctively uniformed Evzones Presidential Guard at the Tomb of the Unknown Soldier. Scenic drive includes Panathenaic Stadium and Temple of Olympian Zeus (both drive-by). Then the National Archaeological Museum — one of the world's great museums, a panorama of Greek civilisation from prehistory to Late Antiquity. Allow the full time here. Returns to ship approximately 12:30pm."},
        {time:"~12:30pm",name:"Afternoon on board Viking Sky",summary:"Quiet ship — spa, pool, lunch on deck — most passengers still ashore",detail:"Most passengers will be on optional tours or independent exploration this afternoon — the ship will be unusually quiet. This is a hidden gem of cruising. Use the thermal spa, sit by the pool with a book, have a leisurely lunch on deck or in the World Cafe. Day 8 of the ocean cruise — an afternoon doing nothing in a comfortable ship is exactly right. Rest up for the evening in Athens."},
        {time:"~6:00pm",name:"Metro from Piraeus to Monastiraki",summary:"Walk or port bus to Piraeus Metro → Line 1 Green Line → Monastiraki — 20 min, €1.40pp",detail:"Walk 15 to 20 minutes from the cruise terminal to Piraeus Metro station, or take the free port shuttle bus to Gate E6 area and cross via the pedestrian bridge. Take Metro Line 1 (Green Line) direction Kifissia to Monastiraki station — approximately 20 minutes, €1.40 per person. Trains run frequently. Alternatively if energy is low after the morning excursion, taxi from the cruise terminal directly to Monastiraki is €20–25 and 20–25 minutes. The Beat app (Athens equivalent of Uber) gives fixed pricing — download before departure from Australia."},
        {time:"~7:00pm",name:"A for Athens rooftop — sunset cocktails",summary:"Miaouli 2–4 Monastiraki — 8th floor — book 7:30pm table 2 days ahead",detail:"A for Athens occupies a boutique hotel on Miaouli Street in Monastiraki. The 8th floor rooftop has been the canonical Athens sunset booking for over a decade. The Acropolis fills the view due south, the Ancient Agora and Thission unfold to the right, city lights pick up as the sky goes orange to blue. Book a 7:30pm table — request front-row rail seats for the Acropolis view. BOOK 2 days ahead at aforathens.com. One drink per person, about an hour — cocktails €10–15 each. This is the aperitif, not the destination meal — stay for one drink then move on to dinner. The Acropolis is illuminated at night and from this rooftop the view is genuinely unforgettable."},
        {time:"~8:30pm",name:"Dinner in Plaka",summary:"5 min walk from A for Athens — Strofi rooftop or local taverna",detail:"Walk 5 minutes from A for Athens into the Plaka district. Two options: (1) STROFI — Rovertou Gkali 25, at the base of the Acropolis south slope. Rooftop terrace with direct Acropolis views, modern Greek cuisine, excellent Greek wine list, generous portions, good value. One of the best restaurants in Athens for over 45 years. Book in advance at strofiathens.com. (2) FIND YOUR OWN — walk uphill away from the main tourist drag. The higher you go from Monastiraki the better the food and lower the prices — look for a handwritten Greek menu and locals eating. Plaka has Byzantine churches, ivy-covered balconies and cobblestone lanes — allow time to wander on the way to or from dinner. Allow 1.5 hours for dinner."},
        {time:"~10:00pm",name:"Taxi back to Viking Sky — Piraeus cruise terminal",summary:"Monastiraki Square → Piraeus cruise terminal — €20–25, 20–25 min",detail:"Hail a taxi from Monastiraki Square or use the Beat app for a fixed price. Tell the driver CRUISE TERMINAL specifically — not just Piraeus, which is a large port area. The cruise ships dock at Terminal B or C near Gate E12 (Lions Gate). Journey approximately 20–25 minutes in normal evening traffic, €20–25 for both of you. Beat app: download before leaving Australia, available on iOS and Android, widely used in Athens, gives upfront fixed fares with no haggling. Uber also operates in Athens. Back on board by 10:30pm."}
      ]},
    { date:"Thu 15 Oct", location:"Athens (Piraeus), Greece – Day 2", flag:"🇬🇷",
      img:"linear-gradient(160deg,#4a2d5c 0%,#2d1a3a 50%,#1a0f20 100%)",heroEmoji:"🫒",heroLabel:"Athens, Greece – Day 2",heroSub:"Plaka District · Monastiraki · National Museum",
      accommodation:"Viking Sky", transport:"Ship docked overnight Piraeus",
      activity:"Second day Athens. Plaka District – 'Neighbourhood of the Gods': cobblestone lanes, neoclassical architecture, meze & ouzo. National Archaeological Museum. Monastiraki flea market. Optional: Cape Sounion and Temple of Poseidon.",
      excursion:"Free day — independent Viator tour: Acropolis + Acropolis Museum + Plaka food tour with lunch (viator.com product 5776P21)", tags:["included"],
      links:[{label:"📍 Day Map — Terminal → Monastiraki → Acropolis → Plaka → Taxi return",url:"https://www.google.com/maps/dir/Piraeus+Cruise+Terminal+Gate+E12/Monastiraki+Square+Athens/Acropolis+of+Athens/Plaka+Athens/Piraeus+Cruise+Terminal",type:"map"},{label:"Book Viator tour — Acropolis + Museum + Plaka lunch (5776P21)",url:"https://www.viator.com/tours/Athens/Athens-Guided-Walking-Tour-The-Acropolis-and-Plaka-Food-Tastings/d496-5776P21",type:"book"},{label:"Athens Metro — Line 1 timetable",url:"https://www.stasy.gr/en/",type:"info"},{label:"Beat app — Athens taxi",url:"https://thebeat.co/en-gr/",type:"info"}] ,
      stops:[
        {time:"Morning",name:"Breakfast on board — check Viking shuttle",summary:"Check noticeboard for Viking shuttle to city — may save taxi cost",detail:"Breakfast on board at leisure. Before heading out, check the Viking Sky noticeboard or ask guest services whether a ship shuttle is running to central Athens (Syntagma or Monastiraki area) on Thursday. If available, the shuttle is approximately €12–18 per person return and drops you close to the tour meeting point — worth using if timed well. If no shuttle, the metro is the best option for the outward journey."},
        {time:"~9:00am",name:"Metro from Piraeus to Monastiraki",summary:"Walk or port bus to Piraeus Metro → Line 1 Green Line → Monastiraki — 20 min, €1.40pp",detail:"Walk 15 to 20 minutes from the cruise terminal to Piraeus Metro station, or take the free port shuttle bus from near Gate E12 toward Gate E6 area. Take Metro Line 1 (Green Line) direction Kifissia to Monastiraki station — approximately 20 minutes, €1.40 per person. Exit at Monastiraki and walk 5 minutes south to the tour meeting point: Porinou 5, inside Athens Walks, near the Acropolis Metro station. Your guide will be waiting."},
        {time:"~9:30am",name:"Viator tour: Acropolis + Museum + Plaka food tour with lunch",summary:"5.5 hours — skip-the-line — max 15 travellers — tickets and lunch included — ~AUD $270pp",detail:"Athens Walks Tour Company. Viator product 5776P21. Book at viator.com — average booking is 120 days in advance. Free cancellation up to 24 hours before. Maximum 15 to 20 travellers. All Acropolis and Acropolis Museum entry tickets included. Licensed guide throughout. ITINERARY: Acropolis hilltop — Parthenon (scaffolding scheduled for permanent removal summer 2026, first unobstructed view in 20 years), Erechtheion and Caryatid Porch, Temple of Athena Nike, Propylaea gateway, Theatre of Dionysus, Odeon of Herodes Atticus. Then Acropolis Museum — original Caryatids, full Parthenon frieze reconstruction (originals beside plaster casts of pieces held in the British Museum), ancient ruins visible through glass floors in the basement. Then descend into Plaka — cobbled lanes, Byzantine churches, the extraordinary Anafiotika quarter (whitewashed Cycladic-style houses built by 19th century islanders on the Acropolis north slope). Food market stops: sesame koulóuria bread, loukoumades donuts, filo parcels, pies, cheeses, Greek coffee, meat and fish market walk. Greek lunch included at a local restaurant. Finishes near Monastiraki Square approximately 3pm. PRACTICAL: Wear rubber-soled shoes — marble paths are slippery. Bring water. Hat recommended in October sun. The Acropolis involves a moderate uphill climb on uneven stone — comfortable pace throughout."},
        {time:"~3:00pm",name:"Free time — Monastiraki Square and flea market",summary:"Tour ends here — browse, coffee, sit and watch the city",detail:"The tour finishes near Monastiraki Square. Take the time to browse the Monastiraki flea market — antiques, vintage items, records, jewellery, leather goods. Find a cafe and sit with a Greek coffee watching the square. The metro is steps away if you want to head back early. No agenda — you have covered a remarkable amount of Athens history and culture in one morning. Allow 1 to 1.5 hours at leisure."},
        {time:"~4:30pm",name:"Taxi back to Viking Sky — Piraeus cruise terminal",summary:"Monastiraki Square → Piraeus cruise terminal — €20–25, 20–25 min — Beat app recommended",detail:"From Monastiraki Square, use the Beat app (download before leaving Australia) for a fixed-price taxi to the Piraeus cruise terminal. Tell the driver CRUISE TERMINAL specifically — the ships dock at Terminal B or C near Gate E12 (Lions Gate), not the ferry port. €20–25 for both of you, 20–25 minutes in normal afternoon traffic. Alternatively hail a street taxi from the square — metered fare, confirm driver turns meter on before setting off. Uber also operates in Athens. Back on board by 5pm comfortably. Dinner on board — feet up. Two full days of Athens done."}

// PIN SYSTEM
// ════════════════════════════════════════
let pinEntry = '';
const STORAGE_KEY = 'suth_pin_2026';
const SESSION_KEY = 'suth_session';

function getPin() {
  return localStorage.getItem(STORAGE_KEY) || '2026';
}

function checkSession() {
  const s = sessionStorage.getItem(SESSION_KEY);
  if (s === 'ok') unlockApp(true);
}

function pinPress(val) {
  if (val === 'del') { pinEntry = pinEntry.slice(0,-1); }
  else if (val === 'clear') { pinEntry = ''; }
  else if (pinEntry.length < 4) { pinEntry += val; }
  updatePinDots();
  if (pinEntry.length === 4) {
    setTimeout(checkPin, 150);
  }
}

function updatePinDots() {
  for (let i=0; i<4; i++) {
    document.getElementById('d'+i).classList.toggle('filled', i < pinEntry.length);
  }
}

function checkPin() {
  if (pinEntry === getPin()) {
    sessionStorage.setItem(SESSION_KEY,'ok');
    unlockApp(false);
  } else {
    document.getElementById('pinError').textContent = 'Incorrect PIN. Try again.';
    pinEntry = '';
    updatePinDots();
    setTimeout(() => document.getElementById('pinError').textContent = '', 2000);
  }
}

function unlockApp(silent) {
  document.getElementById('pin-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  updateHeaderStats();
  buildTabs();
  showHome();
}

function lockApp() {
  sessionStorage.removeItem(SESSION_KEY);
  pinEntry = '';
  updatePinDots();
  document.getElementById('pin-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

const TRIP_START = new Date('2026-09-14');
const TRIP_END   = new Date('2026-10-24');

function parseDate(str) {
  const p = str.split(' ');
  const mo = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  return new Date(2026, mo[p[2]], parseInt(p[1]));
}

function updateHeaderStats() {
  const today = new Date(); today.setHours(0,0,0,0);
  const start = new Date(TRIP_START); start.setHours(0,0,0,0);
  const end   = new Date(TRIP_END);   end.setHours(0,0,0,0);
  const total = (end-start)/86400000;
  const elapsed = (today-start)/86400000;
  const el = document.getElementById('countdown');
  const lab = document.getElementById('countdownLabel');
  const fill = document.getElementById('progressFill');
  const prog = document.getElementById('progressLabel');
  if (!el) return;
  if (today < start) {
    el.textContent = Math.ceil((start-today)/86400000);
    lab.textContent = 'days to go';
    fill.style.width = '0%'; prog.textContent = 'Not yet departed';
  } else if (today > end) {
    el.textContent = '✓'; lab.textContent = 'trip complete!';
    fill.style.width = '100%'; prog.textContent = 'Trip complete!';
  } else {
    el.textContent = Math.ceil((end-today)/86400000);
    lab.textContent = 'days left';
    fill.style.width = Math.min(100,(elapsed/total)*100).toFixed(1)+'%';
    prog.textContent = 'Day '+Math.floor(elapsed+1)+' of '+total;
  }
}

function findToday() {
  const today = new Date(); today.setHours(0,0,0,0);
  for (let si=0; si<SEGMENTS.length; si++) {
    for (let di=0; di<SEGMENTS[si].days.length; di++) {
      const d = parseDate(SEGMENTS[si].days[di].date);
      if (d.getTime()===today.getTime()) return {seg:si,day:di};
    }
  }
  const start = new Date(TRIP_START); start.setHours(0,0,0,0);
  return today < start ? {seg:0,day:0} : {seg:SEGMENTS.length-1,day:0};
}

function buildTabs() {
  const c = document.getElementById('segTabs');
  if (!c) return;
  c.innerHTML = '';
  SEGMENTS.forEach((seg,i) => {
    const btn = document.createElement('button');
    btn.className = 'seg-tab'+(i===activeSegment?' active':'');
    btn.innerHTML = `<span class="te">${seg.emoji}</span><span class="tl">${seg.name.split(' ')[0]}</span>`;
    btn.onclick = ()=>{ activeSegment=i; buildTabs(); buildMain(); showItinerary(); };
    c.appendChild(btn);
  });
}

function btnColor(type) {
  if (type==='ticket') return 'btn-ticket';
  if (type==='rest') return 'btn-rest';
  if (type==='book') return 'btn-book';
  return 'btn-map';
}
function btnIcon(type) {
  if (type==='ticket') return '🎟';
  if (type==='rest') return '🍽';
  if (type==='book') return '🔗';
  return 'ℹ️';
}


function buildStops(stops, segIdx, dayIdx) {
  let html = '<div class="stops-list">';
  stops.forEach(function(stop, si) {
    const hasDetail = stop.detail && stop.detail.trim().length > 0;
    const id = 'stop-' + segIdx + '-' + dayIdx + '-' + si;
    html += '<div class="stop-row' + (hasDetail ? '' : ' no-detail') + '"' +
      (hasDetail ? ' onclick="toggleStop(\'' + id + '\')"' : '') + '>';
    html += '<div class="stop-time">' + (stop.time || '') + '</div>';
    html += '<div class="stop-main">';
    html += '<div class="stop-header">';
    html += '<div class="stop-name">' + stop.name + '</div>';
    if (hasDetail) html += '<div class="stop-toggle" id="' + id + '-btn">+ detail</div>';
    html += '</div>';
    if (stop.summary) html += '<div class="stop-summary">' + stop.summary + '</div>';
    if (hasDetail) html += '<div class="stop-detail" id="' + id + '">' + stop.detail + '</div>';
    html += '</div></div>';
  });
  html += '</div>';
  return html;
}

function toggleStop(id) {
  const el = document.getElementById(id);
  const btn = document.getElementById(id + '-btn');
  if (!el) return;
  const open = el.style.display === 'block';
  el.style.display = open ? 'none' : 'block';
  if (btn) btn.textContent = open ? '+ detail' : '- close';
}

function buildMain() {
  const c = document.getElementById('main');
  if (!c) return;
  const seg = SEGMENTS[activeSegment];
  const today = new Date(); today.setHours(0,0,0,0);
  const ti = findToday();
  c.innerHTML = '';

  // Segment header
  const hdr = document.createElement('div');
  hdr.className = 'segment-header';
  hdr.innerHTML = `<div class="seg-icon">${seg.emoji}</div>
    <div><div class="seg-name">${seg.name}</div>
    <div class="seg-count">${seg.days.length} day${seg.days.length!==1?'s':''}</div></div>`;
  c.appendChild(hdr);

  seg.days.forEach((day,di) => {
    const isToday = ti.seg===activeSegment && ti.day===di && parseDate(day.date).getTime()===today.getTime();
    const card = document.createElement('div');
    card.className = 'day-card'+(isToday?' today':'');
    card.id = `card-${activeSegment}-${di}`;
    const nk = `${activeSegment}-${di}`;

    const tagHtml = (day.tags||[]).map(t=>{
      if(t==='included') return '<span class="tag tag-included">✓ Included</span>';
      if(t==='booked') return '<span class="tag tag-booked">★ Pre-booked</span>';
      if(t==='flight') return '<span class="tag tag-flight">✈ Flight</span>';
      if(t==='arrival') return '<span class="tag tag-arrival">🎉 Arrival</span>';
      return '';
    }).join('');

    let excHtml = '';
    if (day.excursion) {
      const isBkd = day.excursion.includes('BOOKED')||day.excursion.includes('INCLUDED');
      excHtml = `<div class="day-section">
        <div class="section-label">Excursion / Activity</div>
        <div class="excursion-block ${isBkd?'booked':''}">${day.excursion}</div></div>`;
    }

    const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(day.location+' '+day.date.split(' ')[2]+' 2026')}`;
    let linkBtns = `<a class="btn btn-map" href="${mapUrl}" target="_blank">🗺 Map</a>`;
    (day.links||[]).forEach(l => {
      linkBtns += `<a class="btn ${btnColor(l.type)}" href="${l.url}" target="_blank">${btnIcon(l.type)} ${l.label}</a>`;
    });

    const heroBg = day.img || 'linear-gradient(160deg,#1a1f3a,#2d6a8f)';
    const heroEmoji = day.heroEmoji || day.flag;
    const heroLabel = day.heroLabel || day.location;
    const heroSub = day.heroSub || '';
    const imgHtml = `<div style="width:100%;height:160px;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:${heroBg};position:relative;overflow:hidden;flex-shrink:0">
      <div style="font-size:54px;line-height:1;z-index:1;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))">${heroEmoji}</div>
      <div style="font-size:13px;font-weight:700;color:rgba(255,255,255,.95);font-family:Georgia,serif;margin-top:8px;letter-spacing:.3px;text-shadow:0 1px 4px rgba(0,0,0,.6);z-index:1;text-align:center;padding:0 12px">${heroLabel}</div>
      ${heroSub ? `<div style="font-size:10px;color:rgba(255,255,255,.7);font-family:Arial,sans-serif;margin-top:3px;text-shadow:0 1px 3px rgba(0,0,0,.5);z-index:1;text-align:center;padding:0 12px">${heroSub}</div>` : ''}
      <div style="position:absolute;bottom:0;left:0;right:0;height:50px;background:linear-gradient(to top,rgba(0,0,0,.4),transparent)"></div>
    </div>`;

    card.innerHTML = `
      <div onclick="toggleCard('card-${activeSegment}-${di}')">
        ${imgHtml}
      </div>
      <div class="day-card-header" onclick="toggleCard('card-${activeSegment}-${di}')">
        <div class="day-header-info">
          <div class="day-flag-date">
            <div class="day-flag">${day.flag}</div>
            <div class="day-date-label">${day.date.split(' ').slice(0,2).join(' ')}</div>
          </div>
          <div class="day-main">
            <div class="day-location">${day.location}${isToday?'<span class="today-badge">📍 Today</span>':''}</div>
            <div class="day-preview">${day.activity}</div>
            ${tagHtml?`<div class="tag-row">${tagHtml}</div>`:''}
          </div>
          <div class="day-chevron">▼</div>
        </div>
      </div>
      <div class="day-body">
        <div class="day-section">
          <div class="section-label">📋 Plan for the Day</div>
          ${day.stops && day.stops.length ? buildStops(day.stops, activeSegment, di) : `<div class="section-content">${day.activity}</div>`}
        </div>
        <div class="day-section">
          <div class="section-label">🏨 Accommodation</div>
          <div class="section-content"><span class="accom-icon">🛏</span>${day.accommodation}</div>
        </div>
        <div class="day-section">
          <div class="section-label">🚗 Getting Around</div>
          <div class="section-content">${day.transport}</div>
        </div>
        ${excHtml}
        <div class="action-row">${linkBtns}</div>
        <div class="notes-section">
          <div class="notes-label">✏️ Your Notes</div>
          <textarea class="notes-textarea" id="note-${nk}"
            placeholder="Last-minute changes, restaurant finds, tips, reminders…"
            oninput="saveNote('${nk}')">${notes[nk]||''}</textarea>
          <div class="notes-saved" id="saved-${nk}">✓ Saved</div>
        </div>
      </div>`;

    c.appendChild(card);
    if (isToday) card.classList.add('open');
  });
}

function toggleCard(id) {
  document.getElementById(id)?.classList.toggle('open');
}

function saveNote(key) {
  notes[key] = document.getElementById('note-'+key)?.value || '';
  try { localStorage.setItem('suth_notes_2026', JSON.stringify(notes)); } catch(e) {}
  const s = document.getElementById('saved-'+key);
  if (s) { s.classList.add('show'); clearTimeout(s._t); s._t = setTimeout(()=>s.classList.remove('show'),1800); }
}

function changePin() {
  const p1 = document.getElementById('newPin1')?.value;
  const p2 = document.getElementById('newPin2')?.value;
  const msg = document.getElementById('pinMsg');
  if (!p1 || p1.length !== 4 || !/^\d{4}$/.test(p1)) {
    msg.textContent = '❌ PIN must be exactly 4 digits'; msg.style.color='var(--red)'; return;
  }
  if (p1 !== p2) {
    msg.textContent = '❌ PINs do not match'; msg.style.color='var(--red)'; return;
  }
  localStorage.setItem(STORAGE_KEY, p1);
  msg.textContent = '✓ PIN updated successfully'; msg.style.color='var(--green)';
  setTimeout(()=>{msg.textContent='';},2500);
}

function setPanel(p) {
  activePanel = p;
  ['homeBtn','itinBtn','docsBtn','packBtn','taskBtn','esimBtn','settBtn'].forEach(id=>{
    document.getElementById(id)?.classList.remove('primary','secondary','active-docs','active-pack','active-task','active-esim','active-home');
    document.getElementById(id)?.classList.add('secondary');
  });
  if (p==='home') { document.getElementById('homeBtn')?.classList.replace('secondary','active-home'); }
  else if (p==='itinerary') { document.getElementById('itinBtn')?.classList.replace('secondary','primary'); }
  else if (p==='docs')  { document.getElementById('docsBtn')?.classList.replace('secondary','active-docs'); }
  else if (p==='packing') { document.getElementById('packBtn')?.classList.replace('secondary','active-pack'); }
  else if (p==='tasks') { document.getElementById('taskBtn')?.classList.replace('secondary','active-task'); }

}

function buildPackingPanel() {

  html += '<div style="font-size:18px;font-weight:700;color:var(--navy);margin-bottom:4px">Packing Checklist - Gary</div>';

  html += '<div class="pack-progress"><div class="pack-progress-bar" style="width:'+pct+'%"></div></div>';
  html += '<div class="pack-note">Bags: [S] Samsonite 75cm checked &nbsp;[B] Tomtoc 40L Backpack carry-on &nbsp;[X] Sling Bag &nbsp;[W] Wearing on travel day</div>';

      const key = 'pack-'+si+'-'+ii;
      const isChecked = saved[key] || false;
      const chk = isChecked ? ' checked' : '';
      const cls = isChecked ? 'pack-item checked' : 'pack-item';
      const chkAttr = isChecked ? 'checked' : '';
      html += '<div class="'+cls+'" onclick="togglePack(\''+key+'\')" id="pi-'+key+'">';
      html += '<input type="checkbox" '+chkAttr+' onclick="event.stopPropagation();togglePack(\''+key+'\')">';

  document.getElementById('pack-panel').innerHTML = html;
}

function togglePack(key) {
  const saved = JSON.parse(localStorage.getItem('packingState') || '{}');

  localStorage.setItem('packingState', JSON.stringify(saved));

}

function resetPacking() {
  if (confirm('Reset all packing checkboxes?')) {

}

function buildTasksPanel() {
  const saved = JSON.parse(localStorage.getItem('taskState') || '{}');
  let total = 0, done = 0;
  TASK_GROUPS.forEach(g => g.items.forEach(() => total++));
  Object.values(saved).forEach(v => { if(v) done++; });
  const pct = total ? Math.round(done/total*100) : 0;

  let html = '<div class="task-group">';
  html += '<div style="font-size:18px;font-weight:700;color:var(--navy);margin-bottom:4px">Trip Task List</div>';
  html += '<div class="task-summary">'+done+' of '+total+' tasks completed ('+pct+'%)</div>';
  html += '<div class="task-progress"><div class="task-progress-bar" style="width:'+pct+'%"></div></div>';
  html += '<div style="font-size:11px;color:var(--text-muted);font-style:italic;margin-bottom:8px">Tap any task to mark complete. Red = do now, Orange = before departure, Blue = book before travel, Purple = during trip.</div>';
  html += '<button onclick="resetTasks()" style="font-size:11px;padding:4px 10px;border:1px solid var(--stone-dark);border-radius:4px;background:var(--stone);cursor:pointer;">Reset all</button>';
  html += '</div>';

  TASK_GROUPS.forEach(function(group, gi) {
    html += '<div class="task-group">';
    html += '<div class="task-group-title" style="background:'+group.color+'">'+group.title+'</div>';
    group.items.forEach(function(item, ii) {
      const key = 'task-'+gi+'-'+ii;
      const isDone = saved[key] || false;
      const cls = isDone ? 'task-item done' : 'task-item';
      html += '<div class="'+cls+'" onclick="toggleTask(\''+key+'\')" id="ti-'+key+'">';
      html += '<input type="checkbox" '+(isDone?'checked':'')+' onclick="event.stopPropagation();toggleTask(\''+key+'\')">';
      html += '<div class="task-item-body">';
      html += '<div class="task-item-text">'+item.text+'</div>';
      html += '<div class="task-item-meta">'+item.meta+'</div>';
      html += '</div>';
      const badgeClass = isDone ? 'done-badge' : item.badge;
      const badgeLabel = isDone ? 'Done' : (item.badge === 'urgent' ? 'Urgent' : item.badge === 'soon' ? 'Soon' : 'When needed');
      html += '<span class="task-badge '+badgeClass+'">'+badgeLabel+'</span>';
      html += '</div>';
    });
    html += '</div>';
  });

  document.getElementById('task-panel').innerHTML = html;
}

function toggleTask(key) {
  const saved = JSON.parse(localStorage.getItem('taskState') || '{}');

}

function resetTasks() {

}

// HOME SCREEN WITH CALENDAR
// ════════════════════════════════════════

// Segment colour map for calendar
const SEG_COLOURS = {
  'travel':  { bg:'#4a5568', emoji:'✈️', label:'Travel' },
  'paris':   { bg:'#2d6a8f', emoji:'🗼', label:'Paris' },
  'magni':   { bg:'#1a5c3a', emoji:'🚢', label:'Magni' },
  'budapest':{ bg:'#7c3d8f', emoji:'🏛️', label:'Budapest' },
  'sky':     { bg:'#8b2635', emoji:'⚓', label:'Sky' },
  'istanbul':{ bg:'#8b5e00', emoji:'🕌', label:'Istanbul' },
};

function buildDayMap() {
  const map = {};
  SEGMENTS.forEach(seg => {
    seg.days.forEach((day, di) => {
      const d = parseDate(day.date);
      const key = d.toISOString().slice(0,10);
      map[key] = { seg: seg.id, segIdx: SEGMENTS.indexOf(seg), dayIdx: di, day };
    });
  });
  return map;
}

function buildHomePanel() {
  const today = new Date(); today.setHours(0,0,0,0);
  const tripStart = new Date('2026-09-14'); tripStart.setHours(0,0,0,0);
  const tripEnd   = new Date('2026-10-24'); tripEnd.setHours(0,0,0,0);
  const dayMap = buildDayMap();

  // Stats
  const totalDays = 41;
  const taskSaved = JSON.parse(localStorage.getItem('taskState') || '{}');
  const taskTotal = TASK_GROUPS.reduce((a,g) => a+g.items.length, 0);
  const taskDone  = Object.values(taskSaved).filter(Boolean).length;
  const packSaved = JSON.parse(localStorage.getItem('packingState') || '{}');
  const packTotal = PACKING_SECTIONS.reduce((a,s) => a+s.items.length, 0);
  const packDone  = Object.values(packSaved).filter(Boolean).length;

  let statusText, statusSub;
  if (today < tripStart) {
    const days = Math.ceil((tripStart - today) / 86400000);
    statusText = days + ' days to go!';
    statusSub = 'Sutherland European Adventure 2026';
  } else if (today > tripEnd) {
    statusText = 'Trip Complete!';
    statusSub = '41 extraordinary days across Europe';
  } else {
    const day = Math.floor((today - tripStart) / 86400000) + 1;
    statusText = 'Day ' + day + ' of 41';
    statusSub = 'You are on your adventure!';
  }

  // Build calendar months (Sep + Oct 2026)
  const months = [
    { year: 2026, month: 8, name: 'September 2026' },  // 0-indexed
    { year: 2026, month: 9, name: 'October 2026' },
  ];

  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let calHtml = '';
  months.forEach(({ year, month, name }) => {
    calHtml += '<div class="cal-section">';
    calHtml += '<div class="cal-month">' + name + '</div>';
    calHtml += '<div class="cal-grid">';
    dows.forEach(d => { calHtml += '<div class="cal-dow">'+d+'</div>'; });

    const firstDay = new Date(year, month, 1).getDay(); // 0=Sun
    const daysInMonth = new Date(year, month+1, 0).getDate();

    // Empty cells before first day
    for (let i = 0; i < firstDay; i++) {
      calHtml += '<div class="cal-day empty"></div>';
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(year, month, d);
      date.setHours(0,0,0,0);
      const key = date.toISOString().slice(0,10);
      const isToday = date.getTime() === today.getTime();
      const tripDay = dayMap[key];

      if (tripDay) {
        const sc = SEG_COLOURS[tripDay.seg] || { bg:'#4a5568', emoji:'🌍', label:'' };
        const locStr = tripDay.day.calLabel || tripDay.day.location.split('–')[0].split('→')[0].trim();
        const shortLoc = locStr.slice(0,8);
        calHtml += '<div class="cal-day trip'+(isToday?' today-day':'')+'" ';
        calHtml += 'style="background:'+(isToday?'var(--gold)':sc.bg+'22')+';border:1.5px solid '+sc.bg+(isToday?';box-shadow:0 0 0 2px var(--navy)':'')+'" ';
        calHtml += 'onclick="calDayClick('+tripDay.segIdx+','+tripDay.dayIdx+')" ';
        calHtml += 'title="'+tripDay.day.date+' - '+tripDay.day.location+'">';
        calHtml += '<span class="cal-day-num" style="color:'+(isToday?'var(--navy)':sc.bg)+'">'+d+'</span>';
        calHtml += '<span class="cal-day-emoji">'+sc.emoji+'</span>';
        calHtml += '<span class="cal-day-seg" style="color:'+(isToday?'var(--navy)':'#555')+'">'+shortLoc+'</span>';
        calHtml += '</div>';
      } else if (date >= tripStart && date <= tripEnd) {
        calHtml += '<div class="cal-day pre-trip"><span class="cal-day-num">'+d+'</span></div>';
      } else {
        calHtml += '<div class="cal-day"><span class="cal-day-num" style="color:#ccc">'+d+'</span></div>';
      }
    }
    calHtml += '</div></div>';
  });

  // Legend
  let legendHtml = '<div class="cal-legend">';
  Object.values(SEG_COLOURS).forEach(sc => {
    legendHtml += '<div class="cal-legend-item"><div class="cal-legend-dot" style="background:'+sc.bg+'"></div>'+sc.emoji+' '+sc.label+'</div>';
  });
  legendHtml += '</div>';

  document.getElementById('home-panel').innerHTML = `
    <div class="home-welcome">
      <div class="home-welcome-title">🌍 Sutherland European Adventure</div>
      <div class="home-welcome-sub">${statusText} &nbsp;·&nbsp; ${statusSub}</div>
      <div class="home-stats">
        <div class="home-stat"><div class="home-stat-num">41</div><div class="home-stat-label">Days</div></div>
        <div class="home-stat"><div class="home-stat-num">${taskDone}/${taskTotal}</div><div class="home-stat-label">Tasks Done</div></div>
        <div class="home-stat"><div class="home-stat-num">${packDone}/${packTotal}</div><div class="home-stat-label">Items Packed</div></div>
      </div>
      <div class="home-btn-row">
        <button class="home-action-btn today" onclick="goToday()">📍 Go to Today</button>
        <button class="home-action-btn signout" onclick="lockApp()">🔒 Sign Out</button>
      </div>
    </div>
    ${legendHtml}
    ${calHtml}
    <div style="text-align:center;font-size:11px;color:var(--text-muted);padding:8px 0">Tap any trip day to open its itinerary</div>
  `;
}

function calDayClick(segIdx, dayIdx) {
  activeSegment = segIdx;
  buildTabs();
  showItinerary();
  setTimeout(() => {
    const el = document.getElementById(`card-${segIdx}-${dayIdx}`);
    if (el) { el.scrollIntoView({ behavior:'smooth', block:'start' }); el.classList.add('open'); }
  }, 150);
}

function goToday() {
  const info = findToday();
  if (info.seg !== activeSegment) {
    activeSegment = info.seg;
    buildTabs();
  }
  showItinerary();
  setTimeout(()=>{
    const el = document.getElementById(`card-${info.seg}-${info.day}`);
    if (el) { el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.add('open'); }
  }, 150);
}
